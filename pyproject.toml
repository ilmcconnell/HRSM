[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrsmpipe"
version = "0.1.0"
description = "High-Resolution Soil Moisture (HRSM) mapping: ML + LGAR/EnKF pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "mapie==1.1.0",
  "wiscopy>=0.2",
  "typer",
  "pydantic>=2",
  "tomli-w",
]

[project.scripts]
hrsmpipe = "hrsmpipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hrsmpipe"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
# ML. scikit-learn 1.7.2 is what the trainedML/*.joblib files were pickled with. Confirmed in M2: predictions
# (y_mean, post-processed grids) equal the notebook's saved 1.5.2 outputs exactly (max abs diff 0.0).
scikit-learn = "==1.7.2"
lightgbm = "*"
joblib = "*"
numpy = "*"
pandas = "*"
scipy = "*"
pyarrow = "*"
xarray = "*"
netcdf4 = "*"
earthengine-api = "*"
matplotlib = "*"
seaborn = "*"
tqdm = "*"
pytest = "*"
ruff = "*"
mkdocs = "*"
ipykernel = "*"
jupyterlab = "*"

[tool.pixi.pypi-dependencies]
hrsmpipe = { path = ".", editable = true }

[tool.pixi.tasks]
lab = "jupyter lab"
hrsmpipe = "hrsmpipe"
test = "pytest"
docs = "python scripts/gen_config_reference.py && mkdocs build --strict"
lint = "ruff check src tests scripts && ruff format --check src tests scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs the owner's data under $HRSM_DATA_DIR (deselect with -m 'not data')",
  "gee: needs Google Earth Engine credentials (deselect with -m 'not gee')",
]
addopts = "-m 'not data and not gee'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long prose lines in docstrings are fine
